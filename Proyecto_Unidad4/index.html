<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafío de Iluminación 3D - Proyecto U4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #interfaz {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            pointer-events: none;
            text-shadow: 2px 2px #000;
            width: 300px;
        }
        .error { color: #ff4444; font-weight: bold; font-size: 1.5em; }
        
        /* Estilo para la barra de batería */
        #contenedor-bateria {
            width: 100%;
            height: 20px;
            border: 1px solid #0f0;
            margin-top: 10px;
        }
        #barra-bateria {
            width: 100%;
            height: 100%;
            background-color: #0f0;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    <div id="interfaz">
        <h1 id="titulo">MODO BUSQUEDA: ACTIVADO</h1>
        <p id="instruccion">Cargando misión...</p>
        <p id="objetivo" style="font-size: 1.2em; background: rgba(0,255,0,0.1); padding: 5px;"></p>
        <p id="progreso">Encontrados: 0 / 5</p>
        
        <label>ENERGÍA LINTERNA:</label>
        <div id="contenedor-bateria">
            <div id="barra-bateria"></div>
        </div>
    </div>
    <script src = "../libs/p5.min.js"></script>
    ss<script src="sketch.js"></script>
</body>
</html>
